<!<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard – Nest Realtor</title>
  <link rel="stylesheet" href="assets/style.css">
  <style>
    body {
      font-family: "Poppins", sans-serif;
      background: #f8fafc;
      margin: 0;
      color: #1e293b;
    }

    header {
      background: #0f172a;
      color: #fff;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 1.4rem;
      margin: 0;
    }

    header button {
      background: #38bdf8;
      border: none;
      color: #fff;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
    }

    main {
      padding: 2rem;
      max-width: 1100px;
      margin: auto;
    }

    .section {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      padding: 1.5rem;
      margin-bottom: 2rem;
    }

    .section h2 {
      margin-top: 0;
      color: #0f172a;
      font-size: 1.2rem;
      margin-bottom: 1rem;
    }

    #chatBox {
      height: 300px;
      overflow-y: auto;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 1rem;
      background: #f9fafb;
    }

    #userInput {
      width: 80%;
      padding: 0.7rem;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
    }

    #sendBtn {
      padding: 0.7rem 1rem;
      border: none;
      background: #38bdf8;
      color: white;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 500;
    }

    footer {
      text-align: center;
      padding: 1.5rem;
      color: #94a3b8;
      font-size: 0.9rem;
    }

    .message {
      margin-bottom: 0.8rem;
      line-height: 1.4;
    }

    .message.user {
      text-align: right;
      color: #0ea5e9;
    }

    .message.bot {
      text-align: left;
      color: #334155;
    }
  </style>
</head>

<body>
  <header>
    <h1>Nest Realtor Dashboard</h1>
    <button id="logoutBtn">Logout</button>
  </header>

  <main>
    <h2 id="greeting" style="margin-bottom: 20px;">Welcome back, Agent 👋</h2>

    <!-- 1️⃣ Lead Generator -->
    <div class="section">
      <h2>Lead Generator</h2>
      <p>Type what kind of leads you want, and the system will fetch them for you.</p>
      <div class="lead-form">
        <input type="text" id="leadRequest" placeholder="Example: Buyers looking for homes in Sandton under R2M">
        <button id="generateLeadsBtn">Generate Leads</button>
      </div>
      <div id="leadResults" class="lead-results">
        <p>Results will appear here...</p>
      </div>
    </div>

    <!-- 2️⃣ Chat Section -->
    <div class="section">
      <h2>AI Chat Assistant</h2>
      <div id="chatBox"></div>
      <input type="text" id="userInput" placeholder="Ask about leads, prices, or areas...">
      <button id="sendBtn">Send</button>
    </div>

    <!-- 3️⃣ Profile -->
    <div class="section">
      <h2>Your Profile</h2>
      <p id="userEmail">Loading...</p>
    </div>
  </main>

  <footer>
    &copy; <span id="year"></span> Nest Realtor. All rights reserved.
  </footer>

  <script>
    const API_URL = "https://nest-realtor-backend-22.onrender.com";
    document.getElementById("year").textContent = new Date().getFullYear();

    // ✅ Auth Protection
    const token = localStorage.getItem("token");
    if (!token) {
      alert("Please log in first.");
      window.location.href = "login.html";
    }

    // ✅ Load Profile
    fetch(`${API_URL}/me`, {
      headers: { "Authorization": `Bearer ${token}` }
    })
    .then(res => res.json())
    .then(data => {
      if (data.email) {
        document.getElementById("userEmail").textContent = "Logged in as: " + data.email;
      } else {
        localStorage.removeItem("token");
        window.location.href = "login.html";
      }
    })
    .catch(() => {
      localStorage.removeItem("token");
      window.location.href = "login.html";
    });

    // ✅ Logout
    document.getElementById("logoutBtn").addEventListener("click", () => {
      localStorage.removeItem("token");
      window.location.href = "login.html";
    });

    // 💬 AI Chat
    const chatBox = document.getElementById("chatBox");
    const input = document.getElementById("userInput");
    const sendBtn = document.getElementById("sendBtn");

    async function sendMessage() {
      const text = input.value.trim();
      if (!text) return;

      const userMsg = document.createElement("div");
      userMsg.className = "message user";
      userMsg.textContent = "You: " + text;
      chatBox.appendChild(userMsg);
      chatBox.scrollTop = chatBox.scrollHeight;
      input.value = "";

      const botMsg = document.createElement("div");
      botMsg.className = "message bot";
      botMsg.textContent = "Bot: Searching for leads...";
      chatBox.appendChild(botMsg);
      chatBox.scrollTop = chatBox.scrollHeight;

      try {
        const res = await fetch(`${API_URL}/chat`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${token}`
          },
          body: JSON.stringify({ message: text })
        });

        const data = await res.json();
        botMsg.textContent = "Bot: " + (data.reply || "No response received.");
      } catch (err) {
        botMsg.textContent = "Bot: Server error — please try again later.";
      }

      chatBox.scrollTop = chatBox.scrollHeight;
    }

    sendBtn.addEventListener("click", sendMessage);
    input.addEventListener("keypress", e => {
      if (e.key === "Enter") sendMessage();
    });

    // 🔍 Lead Generator
    document.getElementById("generateLeadsBtn").addEventListener("click", async () => {
      const query = document.getElementById("leadRequest").value.trim();
      const output = document.getElementById("leadResults");
      output.innerHTML = "<p>Generating leads... please wait.</p>";

      try {
        const res = await fetch(`${API_URL}/generate-leads`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: `Bearer ${token}`,
          },
          body: JSON.stringify({ query }),
        });

        const data = await res.json();
        if (res.ok) {
          output.innerHTML = `
            <h4>Leads Found:</h4>
            <ul>${data.leads.map(
              (lead) =>
                `<li><strong>${lead.name}</strong> — ${lead.email || "no email"} (${lead.location || "unknown"})</li>`
            ).join("")}</ul>
          `;
        } else {
          output.innerHTML = `<p>${data.detail || "No leads found or an error occurred."}</p>`;
        }
      } catch (err) {
        output.innerHTML = "<p>Server error — please try again later.</p>";
      }
    });<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDc-e04hFYpZ8WDmvFcqBf1zbDfTekGpv8",
    authDomain: "nest-realtor.firebaseapp.com",
    projectId: "nest-realtor",
    storageBucket: "nest-realtor.firebasestorage.app",
    messagingSenderId: "555349990757",
    appId: "1:555349990757:web:4208a19264dbefc5b6158c",
    measurementId: "G-ZN2V4ZMCGP"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  // Check if user is logged in
  onAuthStateChanged(auth, (user) => {
    if (!user) {
      // Not logged in → redirect
      window.location.href = "index.html";
    } else {
      console.log("✅ Logged in as:", user.email);
      document.body.style.display = "block"; // Show dashboard
    }
  });

  // Optional logout button
  const logoutBtn = document.getElementById("logoutBtn");
  if (logoutBtn) {
    logoutBtn.addEventListener("click", () => {
      signOut(auth).then(() => {
        alert("You’ve been signed out.");
        window.location.href = "index.html";
      });
    });
  }

  </script>
</body>
</html>
