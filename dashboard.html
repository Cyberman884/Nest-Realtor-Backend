<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard – Nest Realtor</title>
  <link rel="stylesheet" href="assets/style.css">
  <style>
    body {
      font-family: "Poppins", sans-serif;
      background: #f8fafc;
      margin: 0;
      color: #1e293b;
      display: none; /* Hidden until user is verified */
    }
    header {
      background: #0f172a;
      color: #fff;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 {
      font-size: 1.4rem;
      margin: 0;
    }
    header button {
      background: #38bdf8;
      border: none;
      color: #fff;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
    }
    main {
      padding: 2rem;
      max-width: 1100px;
      margin: auto;
    }
    .section {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      padding: 1.5rem;
      margin-bottom: 2rem;
    }
    .section h2 {
      margin-top: 0;
      color: #0f172a;
      font-size: 1.2rem;
      margin-bottom: 1rem;
    }
    #chatBox {
      height: 300px;
      overflow-y: auto;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 1rem;
      background: #f9fafb;
    }
    #userInput {
      width: 80%;
      padding: 0.7rem;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
    }
    #sendBtn {
      padding: 0.7rem 1rem;
      border: none;
      background: #38bdf8;
      color: white;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 500;
    }
    footer {
      text-align: center;
      padding: 1.5rem;
      color: #94a3b8;
      font-size: 0.9rem;
    }
    .message {
      margin-bottom: 0.8rem;
      line-height: 1.4;
    }
    .message.user {
      text-align: right;
      color: #0ea5e9;
    }
    .message.bot {
      text-align: left;
      color: #334155;
    }
  </style>
</head>

<body>
  <header>
    <h1>Nest Realtor Dashboard</h1>
    <button id="logoutBtn">Logout</button>
  </header>

  <main>
    <h2 id="greeting" style="margin-bottom: 20px;">Welcome back, Agent 👋</h2>

    <!-- 1️⃣ Lead Generator -->
    <div class="section">
      <h2>Lead Generator</h2>
      <p>Type what kind of leads you want, and the system will fetch them for you.</p>
      <div class="lead-form">
        <input type="text" id="leadRequest" placeholder="Example: Buyers looking for homes in Sandton under R2M">
        <button id="generateLeadsBtn">Generate Leads</button>
      </div>
      <div id="leadResults" class="lead-results">
        <p>Results will appear here...</p>
      </div>
    </div>

    <!-- 2️⃣ Chat Section -->
    <div class="section">
      <h2>AI Chat Assistant</h2>
      <div id="chatBox"></div>
      <input type="text" id="userInput" placeholder="Ask about leads, prices, or areas...">
      <button id="sendBtn">Send</button>
    </div>

    <!-- 3️⃣ Profile -->
    <div class="section">
      <h2>Your Profile</h2>
      <p id="userEmail">Loading...</p>
    </div>
  </main>

  <footer>
    &copy; <span id="year"></span> Nest Realtor. All rights reserved.
  </footer>

  <!-- ✅ Supabase & Dashboard Scripts -->
  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    const SUPABASE_URL = "https://vhyviazazgrpmuujzpxu.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZoeXZpYXphemdycG11dWp6cHh1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjI5MDY3MjEsImV4cCI6MjA3ODQ4MjcyMX0.dhm1VSZEIgFLrEHi8ATfsJjfnm7H9CEpHiuCqDybqzg";

    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);
    const API_URL = "https://nest-realtor-backend-22.onrender.com";

    document.getElementById("year").textContent = new Date().getFullYear();

    // ✅ Auth + Trial Check
    async function checkAuthAndTrial() {
      const { data } = await supabase.auth.getUser();
      if (!data.user) {
        window.location.href = "login.html";
        return;
      }

      const user = data.user;
      document.body.style.display = "block";
      document.getElementById("userEmail").textContent = "Logged in as: " + user.email;

      // ✅ Check user usage
      const { data: usage } = await supabase
        .from("user_usage")
        .select("*")
        .eq("user_id", user.id)
        .single();

      if (!usage) {
        await supabase.from("user_usage").insert([{ user_id: user.id, trial_count: 0, subscribed: false }]);
      } else if (usage.trial_count >= 3 && !usage.subscribed) {
        alert("⚠️ Your free trial is over. Please upgrade to continue using the dashboard.");
        window.location.href = "pricing.html";
      } else {
        // Increment trial count
        await supabase
          .from("user_usage")
          .update({ trial_count: usage.trial_count + 1 })
          .eq("user_id", user.id);
      }
    }

    await checkAuthAndTrial();

    // ✅ Logout
    document.getElementById("logoutBtn").addEventListener("click", async () => {
      await supabase.auth.signOut();
      window.location.href = "login.html";
    });

    // 💬 AI Chat
    const chatBox = document.getElementById("chatBox");
    const input = document.getElementById("userInput");
    const sendBtn = document.getElementById("sendBtn");

    async function sendMessage() {
      const text = input.value.trim();
      if (!text) return;

      const userMsg = document.createElement("div");
      userMsg.className = "message user";
      userMsg.textContent = "You: " + text;
      chatBox.appendChild(userMsg);
      chatBox.scrollTop = chatBox.scrollHeight;
      input.value = "";

      const botMsg = document.createElement("div");
      botMsg.className = "message bot";
      botMsg.textContent = "Bot: Searching for leads...";
      chatBox.appendChild(botMsg);
      chatBox.scrollTop = chatBox.scrollHeight;

      try {
        const res = await fetch(`${API_URL}/chat`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text })
        });

        const data = await res.json();
        botMsg.textContent = "Bot: " + (data.reply || "No response received.");
      } catch (err) {
        botMsg.textContent = "Bot: Server error — please try again later.";
      }

      chatBox.scrollTop = chatBox.scrollHeight;
    }

    sendBtn.addEventListener("click", sendMessage);
    input.addEventListener("keypress", e => {
      if (e.key === "Enter") sendMessage();
    });

    // 🔍 Lead Generator
    document.getElementById("generateLeadsBtn").addEventListener("click", async () => {
      const query = document.getElementById("leadRequest").value.trim();
      const output = document.getElementById("leadResults");
      output.innerHTML = "<p>Generating leads... please wait.</p>";

      try {
        const res = await fetch(`${API_URL}/generate-leads`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ query }),
        });

        const data = await res.json();
        if (res.ok) {
          output.innerHTML = `
            <h4>Leads Found:</h4>
            <ul>${data.leads.map(
              (lead) =>
                `<li><strong>${lead.name}</strong> — ${lead.email || "no email"} (${lead.location || "unknown"})</li>`
            ).join("")}</ul>
          `;
        } else {
          output.innerHTML = `<p>${data.detail || "No leads found or an error occurred."}</p>`;
        }
      } catch (err) {
        output.innerHTML = "<p>Server error — please try again later.</p>";
      }
    });
  </script>
  <script src="assets/script.js"></script>

</body>
</html>
